<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1a8">
<title>Tiokompisarna</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243552}body{background:linear-gradient(#dff7ff,#fff3c9);text-align:center;min-height:100vh}header{background:#fff1a8;padding:15px 10px;font-size:30px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.04)}main{max-width:820px;margin:22px auto;padding:0 18px 30px}.card{background:#fff;border:7px solid #ffb6d4;border-radius:34px;padding:22px;box-shadow:0 9px 0 rgba(0,0,0,.08);min-height:420px;display:flex;flex-direction:column;justify-content:center}.meta{font-size:19px;font-weight:800}.q{font-size:58px;font-weight:900;margin:10px 0 15px}.ten{display:grid;grid-template-columns:repeat(5,54px);gap:9px;justify-content:center;margin:15px auto 22px}.dot{width:54px;height:54px;border-radius:50%;border:4px solid #65758b;background:white}.on{background:#ff76aa;border-color:#c64476}.answers,.start-buttons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.choice,.bigbtn{border:0;cursor:pointer;min-width:110px;padding:15px 24px;border-radius:22px;font-size:36px;font-weight:900;color:#243552;box-shadow:0 6px 0 rgba(0,0,0,.15);font-family:inherit}.choice:active,.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}.a{background:#ff9fc1}.b{background:#82ddfa}.c{background:#a7e9ae}.d{background:#ffd84e}.hint{margin:19px 0 4px;font-size:19px;font-weight:700}.feedback{min-height:42px;font-size:24px;font-weight:900;margin:12px 0}.good{color:#26733b}.try{color:#8b5b00}.next{border:0;background:#ffd84e;color:#243552;font-family:inherit;font-size:23px;font-weight:900;padding:15px 24px;border-radius:20px;box-shadow:0 5px 0 #d7a936;cursor:pointer;margin:8px auto 0}.party{background:linear-gradient(#ffd7ed,#d9f8ff);border-color:#ffd84e}.face{font-size:92px;line-height:1.1}.stars{font-size:38px;margin:10px}.title{font-size:38px;margin:4px 0 14px}.lead{font-size:22px;font-weight:700;margin:5px 0 24px}.small{font-size:18px;color:#58616d;margin-top:18px}.confetti{font-size:36px;letter-spacing:6px;animation:bounce .7s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-8px)}}
@media(max-width:520px){header{font-size:25px}.card{border-width:5px;border-radius:28px;padding:18px;min-height:390px}.q{font-size:46px}.ten{grid-template-columns:repeat(5,44px);gap:7px}.dot{width:44px;height:44px}.choice,.bigbtn{font-size:30px;min-width:90px;padding:13px 20px}.title{font-size:32px}}
</style>
</head>
<body>
<header>🌈 Tiokompisarna ⭐</header>
<main><section id="card" class="card" aria-live="polite">
<div class="face">🌈</div>
<h1 class="title">Hur många tiokompisar vill du göra?</h1>
<p class="lead">Välj hur många tal du vill träna på.</p>
<div class="start-buttons"><button class="bigbtn a" data-n="5">5</button><button class="bigbtn b" data-n="10">10</button><button class="bigbtn c" data-n="15">15</button><button class="bigbtn d" data-n="20">20</button></div>
<div class="small">👀 De tomma ringarna visar hur många som saknas.</div>
</section></main>
<script>
const card=document.getElementById('card');
let total=0,answered=0,correct=0,questions=[],current=null,firstTry=true,audioCtx=null;
const pairs=[1,2,3,4,5,6,7,8,9].map(n=>({n,ans:10-n}));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function note(freq,start,dur,type='sine',gain=.08){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(gain,start+.015);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+dur+.02)}
function cheer(big=false){unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+.02;const ns=big?[[523,0],[659,.11],[784,.22],[1047,.36]]:[[659,0],[784,.10],[988,.21]];ns.forEach(([f,d])=>note(f,t+d,big?.34:.24,'triangle',big?.11:.08))}
function startScreen(){card.className='card';card.innerHTML=`<div class="face">🌈</div><h1 class="title">Hur många tiokompisar vill du göra?</h1><p class="lead">Välj hur många tal du vill träna på.</p><div class="start-buttons">${[5,10,15,20].map((n,i)=>`<button class="bigbtn ${['a','b','c','d'][i]}" data-n="${n}">${n}</button>`).join('')}</div><div class="small">👀 De tomma ringarna visar hur många som saknas.</div>`;card.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>startGame(+b.dataset.n))}
function startGame(n){unlockAudio();total=n;answered=0;correct=0;questions=[];while(questions.length<n){questions.push(...shuffle(pairs))}questions=questions.slice(0,n);showQuestion()}
function optionsFor(ans){let pool=shuffle([1,2,3,4,5,6,7,8,9].filter(x=>x!==ans)).slice(0,2);return shuffle([ans,...pool])}
function dots(n){return Array.from({length:10},(_,i)=>`<span class="dot ${i<n?'on':''}"></span>`).join('')}
function showQuestion(){current=questions[answered];firstTry=true;const opts=optionsFor(current.ans);card.className='card';card.innerHTML=`<div class="meta">Tal ${answered+1} av ${total} · ⭐ ${correct} rätt</div><div class="q">${current.n} + ? = 10</div><div class="ten">${dots(current.n)}</div><div class="answers">${opts.map((x,i)=>`<button class="choice ${['a','b','c'][i]}" data-answer="${x}">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="hint">👀 De tomma ringarna visar hur många som saknas.</div>`;card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,b))}
function answer(value,button){unlockAudio();const fb=document.getElementById('feedback');if(value===current.ans){if(firstTry)correct++;answered++;cheer(false);card.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);button.style.outline='5px solid #43a85b';fb.className='feedback good';fb.textContent=`⭐ Ja! ${current.n} + ${current.ans} = 10`;setTimeout(()=>{if(answered>=total)finish();else if(answered%5===0)checkpoint();else showQuestion()},900)}else{firstTry=false;button.disabled=true;button.style.opacity=.45;fb.className='feedback try';fb.textContent='Nästan! Räkna de tomma ringarna 👀'}}
function checkpoint(){cheer(true);card.className='card party';card.innerHTML=`<div class="confetti">🎉 ⭐ 🎈 ⭐ 🎉</div><div class="face">🥳</div><h1 class="title">Bra jobbat!</h1><p class="lead">Du har svarat på <strong>${answered} tal</strong>.<br>⭐ ${correct} rätt av ${answered}</p><button id="continue" class="next">Fortsätt ▶</button>`;document.getElementById('continue').onclick=showQuestion}
function finish(){cheer(true);card.className='card party';card.innerHTML=`<div class="confetti">🎉 ⭐ 🌈 ⭐ 🎉</div><div class="face">🏆🥳</div><h1 class="title">Superbra jobbat!</h1><p class="lead">Du klarade ${total} tiokompisar!<br>⭐ ${correct} rätt av ${total}</p><div class="stars">⭐⭐⭐⭐⭐</div><button id="again" class="next">Spela igen ↻</button>`;document.getElementById('again').onclick=startScreen}
card.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>startGame(+b.dataset.n));
</script>
</body></html>
